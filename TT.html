<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bot Thuê – Quét Link Trung Nam</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; min-height: 100vh;
      font-family: system-ui, -apple-system, Arial, sans-serif;
      background: #080808; color: #fff;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .card {
      width: 100%; max-width: 420px;
      background: #111; border: 1px solid #292929;
      border-radius: 20px; padding: 22px 18px;
      box-shadow: 0 0 40px rgba(255,44,85,.1);
      text-align: center;
    }
    .logo {
      width: 56px; height: 56px; margin: 0 auto 10px;
      border-radius: 16px;
      background: linear-gradient(135deg, #ff2c55, #25f4ee);
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 18px;
    }
    h1 { margin: 0; font-size: 18px; }
    .botname { color: #25f4ee; font-size: 13px; margin-top: 4px; font-weight: 600; }
    .sub { color: #888; font-size: 12px; margin-top: 6px; line-height: 1.45; }
    .countdown {
      margin-top: 14px; padding: 14px 12px;
      border-radius: 14px; background: #1a1208; border: 1px solid #f59e0b55;
    }
    .countdown .label { font-size: 12px; color: #fbbf24; margin-bottom: 4px; }
    .countdown .time {
      font-size: 36px; font-weight: 800; letter-spacing: 2px;
      font-variant-numeric: tabular-nums; color: #fbbf24;
    }
    .countdown.urgent .time { color: #f87171; }
    .countdown.done .time { color: #4ade80; font-size: 20px; }
    .countdown.expired .time { color: #f87171; font-size: 20px; }
    .box {
      margin-top: 14px; padding: 12px; background: #181818;
      border: 1px solid #292929; border-radius: 14px; text-align: left; font-size: 13px;
    }
    .box b { color: #25f4ee; }
    .ck {
      font-family: ui-monospace, monospace; font-size: 13px;
      background: #0a0a0a; padding: 8px 10px; border-radius: 8px;
      margin-top: 6px; display: block; user-select: all; word-break: break-all;
    }
    #qrWrap {
      margin: 16px auto 0; width: 220px; height: 220px;
      background: #fff; border-radius: 12px; padding: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    #qrWrap img { width: 100%; height: 100%; object-fit: contain; }
    .status {
      margin-top: 14px; padding: 12px; border-radius: 12px;
      border: 1px solid #292929; background: #181818; font-size: 14px; line-height: 1.5;
    }
    .status.wait { border-color: #f59e0b; color: #fbbf24; }
    .status.ok { border-color: #22c55e; color: #4ade80; }
    .status.err { border-color: #ef4444; color: #f87171; }
    button {
      margin-top: 10px; width: 100%; padding: 13px; border: none;
      border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer;
    }
    .btn-copy { background: #3b82f6; color: #fff; }
    .btn-bot {
      background: linear-gradient(135deg, #ff2c55, #ff0050);
      color: #fff; display: none;
    }
    .hint { margin-top: 12px; color: #666; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">TN</div>
    <h1>Thanh toán thuê bot</h1>
    <div class="botname">Bot Thuê – Quét Link Trung Nam</div>
    <p class="sub">@thuebotquetlinktrungnam1_bot · Quét QR · CK đúng nội dung</p>

    <div class="countdown" id="cdBox">
      <div class="label">THỜI HẠN THANH TOÁN</div>
      <div class="time" id="cdTime">10:00</div>
    </div>

    <div class="box" id="infoBox">Đang tải...</div>
    <div id="qrWrap"><span style="color:#333;font-size:12px">QR...</span></div>
    <div class="status wait" id="statusBox">⏳ Quét QR và chuyển khoản...</div>
    <button class="btn-copy" type="button" id="btnCopy">📋 Copy nội dung CK</button>
    <button class="btn-bot" type="button" id="btnBot">✅ Xác nhận đã thanh toán — mở bot</button>
    <p class="hint">Admin hỗ trợ: @dvmxhnam</p>
  </div>
<script>
(function () {
  const SHEET_CSV =
    "https://docs.google.com/spreadsheets/d/1EXAZOdc36TmXwsZCmnyqbgwFoE6bOvFH96E2s7m559c/export?format=csv";
  const BANK_ACC = "033159";
  const BANK_NAME = "MBBank";
  const BANK_HOLDER = "BUI TRUNG NAM";
  const BOT_USERNAME = "thuebotquetlinktrungnam1_bot";
  const POLL_MS = 2000;
  const LAST_ROWS = 60;
  const DEFAULT_SEC = 600;
  const COL_F = 5, COL_G = 6, COL_H = 7;

  const params = new URLSearchParams(location.search);
  const orderId = params.get("order") || "";
  const ck = (params.get("ck") || "").trim().toLowerCase();
  const amount = parseInt(params.get("amount") || "0", 10) || 0;
  const token = (params.get("token") || "").trim();
  let until = parseInt(params.get("until") || "0", 10) || 0;
  if (!until || until < 1e9) until = Math.floor(Date.now() / 1000) + DEFAULT_SEC;

  const infoBox = document.getElementById("infoBox");
  const statusBox = document.getElementById("statusBox");
  const qrWrap = document.getElementById("qrWrap");
  const btnCopy = document.getElementById("btnCopy");
  const btnBot = document.getElementById("btnBot");
  const cdBox = document.getElementById("cdBox");
  const cdTime = document.getElementById("cdTime");

  if (!ck || !amount) {
    infoBox.innerHTML = "❌ Link không hợp lệ. Mở lại từ bot thuê.";
    statusBox.className = "status err";
    statusBox.textContent = "Thiếu thông tin đơn";
    qrWrap.style.display = "none";
    return;
  }

  infoBox.innerHTML =
    (orderId ? "<div>Mã đơn: <b>#" + orderId + "</b></div>" : "") +
    "<div>Số tiền: <b>" + amount.toLocaleString("vi-VN") + "đ</b></div>" +
    "<div>STK: <b>" + BANK_ACC + "</b> · " + BANK_NAME + "</div>" +
    "<div style='margin-top:6px'>Nội dung chuyển khoản:</div>" +
    "<span class='ck'>" + ck + "</span>";

  const img = document.createElement("img");
  img.alt = "QR";
  img.src =
    "https://img.vietqr.io/image/" +
    encodeURIComponent(BANK_NAME) + "-" + encodeURIComponent(BANK_ACC) +
    "-compact2.png?amount=" + amount +
    "&addInfo=" + encodeURIComponent(ck) +
    "&accountName=" + encodeURIComponent(BANK_HOLDER);
  img.onerror = function () {
    qrWrap.innerHTML = "<span style='color:#666;font-size:12px'>Chuyển khoản thủ công theo STK + nội dung</span>";
  };
  qrWrap.innerHTML = "";
  qrWrap.appendChild(img);

  btnCopy.onclick = function () {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(ck).then(function () { btnCopy.textContent = "✅ Đã copy"; });
    } else {
      const ta = document.createElement("textarea");
      ta.value = ck; document.body.appendChild(ta);
      ta.select(); document.execCommand("copy");
      document.body.removeChild(ta);
      btnCopy.textContent = "✅ Đã copy";
    }
  };

  function setStatus(k, h) { statusBox.className = "status " + k; statusBox.innerHTML = h; }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function fmtRemain(s) { s = Math.max(0, s | 0); return pad(Math.floor(s / 60)) + ":" + pad(s % 60); }

  function parseCsvLine(line) {
    const out = []; let cur = ""; let inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; continue; }
      if (c === "," && !inQ) { out.push(cur); cur = ""; continue; }
      cur += c;
    }
    out.push(cur);
    return out;
  }
  function ckFromColF(content) {
    const s = String(content || "").trim().toLowerCase();
    const first = (s.split(/\s+/)[0] || "");
    if (/^quetlinktrungnam\d{7}$/.test(first)) return first;
    const m = s.replace(/\s+/g, "").match(/quetlinktrungnam\d{7}/);
    return m ? m[0] : "";
  }
  function moneyFromColH(raw) {
    const d = String(raw || "").replace(/[^\d]/g, "");
    return d ? parseInt(d, 10) : 0;
  }

  let done = false, expired = false;

  function openBotConfirm() {
    const payload = "ok_" + orderId + "_" + (token || "x");
    location.href = "https://t.me/" + BOT_USERNAME + "?start=" + encodeURIComponent(payload);
  }

  function tickCountdown() {
    if (done) {
      cdBox.className = "countdown done";
      cdTime.textContent = "ĐÃ THANH TOÁN";
      return;
    }
    const remain = until - Math.floor(Date.now() / 1000);
    if (remain <= 0) {
      expired = true;
      cdBox.className = "countdown expired";
      cdTime.textContent = "HẾT HẠN";
      setStatus("err", "⏰ Hết 10 phút. Tạo đơn mới trên bot.");
      return;
    }
    cdTime.textContent = fmtRemain(remain);
    cdBox.className = remain <= 60 ? "countdown urgent" : "countdown";
  }

  function rowMatches(parts) {
    if (parts.length <= COL_H) return false;
    const code = ckFromColF(parts[COL_F]);
    if (!code || code !== ck.replace(/\s+/g, "")) return false;
    const typ = String(parts[COL_G] || "").trim().toLowerCase();
    if (typ === "out" || typ === "chi") return false;
    return moneyFromColH(parts[COL_H]) >= amount;
  }

  async function checkSheet() {
    if (done || expired) return;
    try {
      const res = await fetch(SHEET_CSV + (SHEET_CSV.indexOf("?") >= 0 ? "&" : "?") + "_t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const lines = (await res.text()).split(/\r?\n/).filter(Boolean).slice(1).slice(-LAST_ROWS);
      for (let i = lines.length - 1; i >= 0; i--) {
        const parts = parseCsvLine(lines[i]);
        if (rowMatches(parts)) {
          done = true;
          tickCountdown();
          setStatus("ok",
            "✅ <b>Đã thấy giao dịch</b><br>" +
            "Tiền: <b>" + moneyFromColH(parts[COL_H]).toLocaleString("vi-VN") + "đ</b><br>" +
            "Đang mở bot để xác nhận đơn..."
          );
          btnBot.style.display = "block";
          setTimeout(openBotConfirm, 1200);
          return;
        }
      }
      setStatus("wait", "⏳ Chưa thấy giao dịch · còn " + fmtRemain(until - Math.floor(Date.now() / 1000)));
    } catch (e) {
      setStatus("err", "⚠️ " + (e.message || e));
    }
  }

  btnBot.onclick = openBotConfirm;
  tickCountdown();
  setInterval(tickCountdown, 1000);
  checkSheet();
  setInterval(checkSheet, POLL_MS);
})();
</script>
</body>
</html>
