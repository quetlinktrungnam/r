
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quét Link Trung Nam</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}
html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#050505;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}
.card{
    width:100%;
    max-width:430px;
    padding:28px 22px;
    text-align:center;
    background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));
    border:1px solid rgba(255,255,255,.1);
    border-radius:24px;
    box-shadow:0 20px 70px rgba(0,0,0,.65);
}
.logo{
    font-size:28px;
    font-weight:900;
    letter-spacing:2px;
    background:linear-gradient(90deg,#25f4ee,#fff,#ff2c55);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}
.sub{
    color:#888;
    font-size:13px;
    margin-top:8px;
}
.status{
    margin-top:25px;
    padding:16px;
    border-radius:15px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
    color:#25f4ee;
    font-size:14px;
}
.spinner{
    width:22px;
    height:22px;
    margin:0 auto 12px;
    border:2px solid rgba(255,255,255,.15);
    border-top-color:#25f4ee;
    border-radius:50%;
    animation:spin .7s linear infinite;
}
@keyframes spin{
    to{transform:rotate(360deg)}
}
</style>
</head>

<body>

<div class="card">
    <div class="logo">Quét Link Trung Nam</div>
    <div class="sub">ĐANG KẾT NỐI TIKTOK LIVE</div>

    <div class="status">
        <div class="spinner"></div>
        Đang chuyển đến phòng LIVE...
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<script>
// ===== AES KEY (GIỮ NGUYÊN) =====
const AES_KEY_HEX = "a8f3c91e7b2d4f6a9c0e1b3d5f7a8c9e0b1d2f3a4c5e6b7d8f9a0c1e2b3d4f5a";
const AES_IV_HEX  = "1a2b3c4d5e6f708192a3b4c5d6e7f809";

const AES_KEY = CryptoJS.enc.Hex.parse(AES_KEY_HEX);
const AES_IV = CryptoJS.enc.Hex.parse(AES_IV_HEX);

function aesDecrypt(encrypted){
    if(!encrypted) return "";

    try{
        let b64 = String(encrypted)
            .replace(/-/g,"+")
            .replace(/_/g,"/");

        while(b64.length % 4) b64 += "=";

        const decrypted = CryptoJS.AES.decrypt(b64,AES_KEY,{
            iv:AES_IV,
            mode:CryptoJS.mode.CBC,
            padding:CryptoJS.pad.Pkcs7
        });

        return decrypted.toString(CryptoJS.enc.Utf8);
    }catch(e){
        return "";
    }
}

// ===== LẤY LINK TIKTOK =====
function getTikTokUrl(){
    const params = new URLSearchParams(location.search);
    return params.get("url") || params.get("u") || "";
}

// ===== LẤY ROOM ID TỪ URL =====
function getRoomIdFromUrl(url){
    if(!url) return "";

    let m = url.match(/room_id=(\d+)/i);
    if(m) return m[1];

    m = url.match(/\/live\/(\d+)/i);
    return m ? m[1] : "";
}

// ===== LẤY ROOM ID =====
function getRoomId(){
    const params = new URLSearchParams(location.search);
    const r = params.get("r");

    if(r){
        const decoded = aesDecrypt(r);

        if(decoded && /^\d{10,}$/.test(decoded)){
            return decoded;
        }
    }

    return getRoomIdFromUrl(getTikTokUrl());
}

// ===== MỞ TIKTOK LIVE =====
function openTikTok(){
    const roomId = getRoomId();

    if(!roomId){
        document.querySelector(".status").innerHTML =
            "Không tìm thấy Room ID!";
        return;
    }

    location.href =
        "snssdk1180://live?room_id=" +
        encodeURIComponent(roomId);
}

// ===== TỰ ĐỘNG MỞ =====
window.addEventListener("load",function(){
    setTimeout(openTikTok,250);
});
</script>

</body>
</html>
