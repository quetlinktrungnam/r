<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">
<title>T.NAM</title>
<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}
html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#050505;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}
.container{
    width:100%;
    max-width:430px;
}
.card{
    background:
        linear-gradient(145deg,
        rgba(255,255,255,.07),
        rgba(255,255,255,.025));
    border:1px solid rgba(255,255,255,.10);
    border-radius:24px;
    padding:28px 22px;
    box-shadow:
        0 20px 70px rgba(0,0,0,.65),
        inset 0 1px rgba(255,255,255,.05);
    backdrop-filter:blur(20px);
}
.logo{
    text-align:center;
    font-size:34px;
    font-weight:900;
    letter-spacing:4px;
    margin-bottom:7px;
    background:linear-gradient(
        90deg,
        #25f4ee,
        #fff,
        #ff2c55
    );
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}
.sub{
    text-align:center;
    color:#888;
    font-size:13px;
    margin-bottom:28px;
}
.status{
    padding:15px;
    border-radius:15px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.07);
    text-align:center;
    margin-bottom:18px;
    font-size:14px;
}
.status.loading{
    color:#aaa;
}
.status.success{
    color:#25f4ee;
    border-color:rgba(37,244,238,.25);
}
.status.error{
    color:#ff667f;
    border-color:rgba(255,44,85,.25);
}
.device-title{
    font-size:12px;
    color:#888;
    margin-bottom:8px;
}
.device-box{
    display:flex;
    align-items:center;
    gap:8px;
    background:#090909;
    border:1px solid rgba(255,255,255,.08);
    border-radius:14px;
    padding:5px;
}
.device-code{
    flex:1;
    min-width:0;
    padding:10px;
    font-family:monospace;
    font-size:11px;
    color:#ccc;
    word-break:break-all;
    line-height:1.4;
}
.copy-btn,
.open-btn{
    border:0;
    cursor:pointer;
    color:#fff;
    font-weight:800;
    border-radius:11px;
    padding:11px 14px;
    white-space:nowrap;
}
.copy-btn{
    background:linear-gradient(
        135deg,
        #ff2c55,
        #ff0050
    );
}
.open-btn{
    width:100%;
    margin-top:15px;
    padding:15px;
    font-size:15px;
    background:linear-gradient(
        135deg,
        #25f4ee,
        #1677ff
    );
}
.copy-btn:active,
.open-btn:active{
    transform:scale(.97);
}
.note{
    margin-top:15px;
    color:#777;
    text-align:center;
    font-size:12px;
    line-height:1.5;
}
.hidden{
    display:none !important;
}
.spinner{
    width:20px;
    height:20px;
    margin:0 auto 10px;
    border:2px solid rgba(255,255,255,.15);
    border-top-color:#25f4ee;
    border-radius:50%;
    animation:spin .7s linear infinite;
}
@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}
</style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="logo">T.NAM</div>
        <div class="sub">
            XÁC MINH THIẾT BỊ
        </div>
        <!-- ĐANG KIỂM TRA -->
        <div id="loadingBox" class="status loading">
            <div class="spinner"></div>
            Đang kiểm tra thiết bị...
        </div>
        <!-- CHƯA ĐƯỢC CẤP PHÉP -->
        <div id="deniedBox" class="hidden">
            <div class="status error">
                Thiết bị chưa được cấp phép
            </div>
            <div class="device-title">
                Mã thiết bị của bạn
            </div>
            <div class="device-box">
                <div
                    id="deviceCode"
                    class="device-code">
                </div>
                <button
                    id="copyBtn"
                    class="copy-btn">
                    COPY
                </button>
            </div>
            <div class="note">
                Hãy gửi mã thiết bị này cho quản trị viên
                để được cấp phép.
            </div>
        </div>
        <!-- ĐƯỢC CẤP PHÉP -->
        <div id="approvedBox" class="hidden">
            <div class="status success">
                ✓ Thiết bị đã được cấp phép
            </div>
            <button
                id="openBtn"
                class="open-btn">
                MỞ TIKTOK LIVE
            </button>
            <div
                id="approvedNote"
                class="note">
            </div>
        </div>
    </div>
</div>
<script>
/* =========================================================
   CẤU HÌNH
========================================================= */
/*
   ID Google Sheet của bạn.
   Lấy từ:
   https://docs.google.com/spreadsheets/d/ID_CUA_BAN/edit
*/
const SHEET_ID =
"1-e7G6GYM9eJSKOF1AOdATM4H2X-7erAaqj0VJUCD6T8";
/*
   Sheet mặc định.
   Nếu Sheet của bạn tên khác thì đổi ở đây.
   Ví dụ:
   const SHEET_NAME = "Sheet1";
*/
const SHEET_NAME = "Sheet1";
/*
   Cột A:
   device_id
   Cột B:
   note
   Chỉ đọc dữ liệu.
*/
/* =========================================================
   TẠO MÃ THIẾT BỊ
========================================================= */
function generateDeviceId(){
    /*
       Tạo UUID ngẫu nhiên.
       Sau đó Base64 encode.
       Ví dụ kết quả:
       NWFlMmE0ZjQ5MjMxZGRhZGY0Y2NkOTMxYzc3OTE0MTg=
    */
    const uuid =
        crypto.randomUUID();
    const bytes =
        new TextEncoder().encode(uuid);
    let binary = "";
    bytes.forEach(byte => {
        binary += String.fromCharCode(byte);
    });
    return btoa(binary);
}
/* =========================================================
   LẤY / LƯU DEVICE ID
========================================================= */
function getDeviceId(){
    let id =
        localStorage.getItem(
            "tnam_device_id"
        );
    if(!id){
        id =
            generateDeviceId();
        localStorage.setItem(
            "tnam_device_id",
            id
        );
    }
    return id;
}
/* =========================================================
   LẤY LINK TIKTOK
========================================================= */
function getTikTokUrl(){
    const params =
        new URLSearchParams(
            window.location.search
        );
    return (
        params.get("url") ||
        params.get("u") ||
        ""
    );
}
/* =========================================================
   LẤY ROOM ID
========================================================= */
function getRoomId(url){
    if(!url){
        return "";
    }
    let match =
        url.match(
            /room_id=(\d+)/i
        );
    if(match){
        return match[1];
    }
    match =
        url.match(
            /\/live\/(\d+)/i
        );
    if(match){
        return match[1];
    }
    return "";
}
/* =========================================================
   ĐỌC GOOGLE SHEET
========================================================= */
async function readGoogleSheet(){
    /*
       Google Visualization API.
       Cột A = mã thiết bị
       Cột B = ghi chú
    */
    const query =
        encodeURIComponent(
            "select A,B"
        );
    const url =
        "https://docs.google.com/spreadsheets/d/" +
        SHEET_ID +
        "/gviz/tq?" +
        "sheet=" +
        encodeURIComponent(SHEET_NAME) +
        "&tq=" +
        query +
        "&headers=1";
    const response =
        await fetch(
            url + "&t=" + Date.now(),
            {
                method:"GET",
                cache:"no-store"
            }
        );
    if(!response.ok){
        throw new Error(
            "Không đọc được Google Sheet"
        );
    }
    const text =
        await response.text();
    /*
       Google trả về dạng:
       google.visualization.Query.setResponse({...})
    */
    const match =
        text.match(
            /google\.visualization\.Query\.setResponse\(([\s\S]+)\)/
        );
    if(!match){
        throw new Error(
            "Google Sheet không trả dữ liệu hợp lệ"
        );
    }
    const data =
        JSON.parse(match[1]);
    const rows =
        data?.table?.rows || [];
    const devices = [];
    rows.forEach(row => {
        const cells =
            row.c || [];
        const device =
            cells[0]?.v != null
                ? String(cells[0].v).trim()
                : "";
        const note =
            cells[1]?.v != null
                ? String(cells[1].v).trim()
                : "";
        if(device){
            devices.push({
                device:device,
                note:note
            });
        }
    });
    return devices;
}
/* =========================================================
   KIỂM TRA THIẾT BỊ
========================================================= */
async function checkDevice(){
    const deviceId =
        getDeviceId();
    document
        .getElementById("deviceCode")
        .textContent =
        deviceId;
    try{
        const devices =
            await readGoogleSheet();
        /*
           So sánh chính xác.
           Không phân biệt ghi chú.
        */
        const found =
            devices.find(
                item =>
                    item.device === deviceId
            );
        if(found){
            showApproved(
                found.note
            );
        }else{
            showDenied();
        }
    }catch(error){
        console.error(error);
        showError();
    }
}
/* =========================================================
   HIỂN THỊ CHƯA DUYỆT
========================================================= */
function showDenied(){
    document
        .getElementById("loadingBox")
        .classList
        .add("hidden");
    document
        .getElementById("deniedBox")
        .classList
        .remove("hidden");
    document
        .getElementById("approvedBox")
        .classList
        .add("hidden");
}
/* =========================================================
   HIỂN THỊ ĐÃ DUYỆT
========================================================= */
function showApproved(note){
    document
        .getElementById("loadingBox")
        .classList
        .add("hidden");
    document
        .getElementById("deniedBox")
        .classList
        .add("hidden");
    document
        .getElementById("approvedBox")
        .classList
        .remove("hidden");
    /*
       Ghi chú từ cột B.
       Nếu không có ghi chú thì ẩn.
    */
    const noteBox =
        document
        .getElementById("approvedNote");
    if(note){
        noteBox.textContent =
            "Ghi chú: " + note;
    }else{
        noteBox.textContent = "";
    }
    /*
       Tự thử mở TikTok.
       Nếu iOS/browser chặn tự mở app,
       người dùng vẫn có nút bên dưới.
    */
    setTimeout(
        openTikTok,
        500
    );
}
/* =========================================================
   HIỂN THỊ LỖI
========================================================= */
function showError(){
    const box =
        document
        .getElementById("loadingBox");
    box.className =
        "status error";
    box.innerHTML =
        "Không thể đọc Google Sheet.<br>" +
        "<small>" +
        "Kiểm tra quyền chia sẻ của Google Sheet."
        +
        "</small>";
}
/* =========================================================
   COPY DEVICE ID
========================================================= */
async function copyDevice(){
    const id =
        getDeviceId();
    try{
        await navigator.clipboard.writeText(id);
        const btn =
            document.getElementById(
                "copyBtn"
            );
        const old =
            btn.textContent;
        btn.textContent =
            "ĐÃ COPY";
        setTimeout(
            () => {
                btn.textContent = old;
            },
            1500
        );
    }catch{
        /*
           Fallback cho trình duyệt
           không hỗ trợ clipboard API.
        */
        const input =
            document.createElement("textarea");
        input.value = id;
        input.style.position =
            "fixed";
        input.style.opacity =
            "0";
        document.body.appendChild(input);
        input.select();
        document.execCommand("copy");
        input.remove();
    }
}
/* =========================================================
   MỞ TIKTOK
========================================================= */
function openTikTok(){
    const originalUrl =
        getTikTokUrl();
    const roomId =
        getRoomId(
            originalUrl
        );
    if(!roomId){
        /*
           Không có room_id thì không
           thể tạo deep link LIVE.
        */
        return;
    }
    /*
       TikTok iOS deep link.
    */
    const deepLink =
        "snssdk1180://live?room_id=" +
        encodeURIComponent(roomId);
    window.location.href =
        deepLink;
}
/* =========================================================
   NÚT COPY
========================================================= */
document
    .getElementById("copyBtn")
    .addEventListener(
        "click",
        copyDevice
    );
/* =========================================================
   NÚT MỞ TIKTOK
========================================================= */
document
    .getElementById("openBtn")
    .addEventListener(
        "click",
        openTikTok
    );
/* =========================================================
   CHẠY
========================================================= */
checkDevice();
</script>
</body>
</html>
